<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet" />
    <title>three-text-video-study</title>
  </head>
  <body>
    <div class="study">
      <header class="study__header">
        <a class="study__brand" href="./">three-text-video-study</a>
      </header>
      <main class="workspace">
        <section class="preview" aria-labelledby="scene-title">
          <div class="preview__heading">
            <p class="preview__eyebrow">SCENE 01</p>
            <h1 class="preview__title" id="scene-title">Cube · 浮遊と回転</h1>
          </div>
          <div class="preview__stage">
            <canvas class="preview__canvas" width="1024" height="1024" data-canvas aria-label="浮遊しながら回転するCube"></canvas>
          </div>
          <p class="preview__caption">正方形のプレビュー。選択した解像度で書き出します。</p>
        </section>
        <aside class="panel" aria-label="動画の書き出し設定">
          <div class="panel__intro">
            <h2 class="panel__title">シーンを、短いループ動画に。</h2>
            <p class="panel__description">サイズと画質を選び、MP4で保存できます。</p>
          </div>
          <fieldset class="text-editor" data-text-settings disabled>
            <legend class="text-editor__legend">テキスト</legend>
            <label class="text-editor__label" for="scene-text">Cubeに表示する文章</label>
            <textarea class="text-editor__input" id="scene-text" data-text rows="5" maxlength="500" spellcheck="false" aria-describedby="text-hint">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ。</textarea>
            <p class="text-editor__hint" id="text-hint">自然な位置で自動改行します。入力した改行も反映されます。</p>
            <button class="button button--subtle" type="button" data-apply-text>テキストを反映</button>
          </fieldset>
          <fieldset class="export-settings" data-settings>
            <legend class="export-settings__legend">書き出し設定</legend>
            <div class="export-settings__fields">
              <label class="export-settings__field">
                解像度
                <select class="export-settings__select" data-resolution>
                  <option value="512">512 × 512</option>
                  <option value="1024" selected>1024 × 1024</option>
                </select>
              </label>
              <label class="export-settings__field">
                フレームレート
                <select class="export-settings__select" data-frame-rate>
                  <option value="30" selected>30 fps</option>
                  <option value="60">60 fps</option>
                </select>
              </label>
              <label class="export-settings__field export-settings__field--wide">
                画質
                <select class="export-settings__select" data-quality>
                  <option value="very-low">最低</option>
                  <option value="low">低</option>
                  <option value="medium" selected>標準</option>
                  <option value="high">高</option>
                  <option value="very-high">最高</option>
                </select>
              </label>
            </div>
            <button class="button button--primary" type="button" data-export disabled>MP4を書き出す <span aria-hidden="true">↗</span></button>
          </fieldset>
          <div class="panel__feedback">
            <p class="panel__status" data-status role="status">描画を準備しています…</p>
            <a class="button button--download" data-download hidden>MP4を保存 <span aria-hidden="true">↓</span></a>
            <details class="panel__result" data-result hidden>
              <summary class="panel__summary">書き出した動画を確認</summary>
              <video class="panel__video" data-video controls loop playsinline aria-label="書き出したMP4"></video>
            </details>
          </div>
        </aside>
      </main>
      <footer class="study__footer">
        <span>テキストと映像の習作</span>
        <span>THREE-TEXT-VIDEO-STUDY</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
